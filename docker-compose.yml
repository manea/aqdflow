services:
  aqdflow:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: aqdflow
    restart: unless-stopped
    ports:
      - "127.0.0.1:4179:4179"
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 4179
      AQDFLOW_DATA_DIR: /app/data
      APP_ORIGIN: ${APP_ORIGIN:-}
    volumes:
      - aqdflow_data:/app/data

volumes:
  aqdflow_data:
